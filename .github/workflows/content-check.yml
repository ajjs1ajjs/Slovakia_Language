name: Content CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Lint content
        run: python tools/check_course.py
      - name: Build sample lesson (PDF + sound annotations)
        run: python tools/build_pdf.py --lesson 004
      - name: Verify sample PDF has audio
        run: python tools/verify_pdf.py build/pdf/004.pdf --expect-audio 004
