name: Content CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - name: Lint content
        run: python tools/check_course.py --strict
      - name: Verify audio script parser
        run: python tools/generate_audio.py --all --plan
      - name: Build sample lessons (A0, B1, B2)
        run: |
          for id in 004 301 430; do
            python tools/build_pdf.py --lesson "$id"
            python tools/verify_pdf.py "build/pdf/$id.pdf" --expect-audio "$id"
          done
      - name: Build web & Anki artifacts
        run: |
          python tools/build_web.py
          python tools/build_anki.py
