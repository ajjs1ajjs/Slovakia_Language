<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slovenčina 0 → B2 · Словацька з нуля</title>
<meta name="description" content="Курс словацької 0→B2: транскрипція, вимова, аудіо, офлайн.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4ea2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🇸🇰 Slovenčina <span>0 → B2</span></div>
  <div class="top-actions">
    <button id="btn-slow" class="chip on" title="Повільна вимова">🐢 0.75×</button>
    <button id="btn-print" class="chip" title="Друк / зберегти PDF">🖨 PDF</button>
    <button id="btn-install" class="chip hidden">⬇ Встановити</button>
  </div>
</header>
<nav id="levels" class="levels"></nav>
<div class="search"><input id="q" type="search" placeholder="Пошук лекції… / Hľadať lekciu…"></div>
<main class="wrap">
  <aside id="list" class="list"></aside>
  <article id="lesson" class="lesson"><p class="hint">Оберіть лекцію зі списку 👈<br>Vyberte si lekciu.</p></article>
</main>
<div id="player" class="player hidden">
  <button id="p-play">▶</button><span id="p-title"></span>
  <audio id="audio" controls preload="none"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
